services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    volumes:
      - umetv-redis:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  turn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        args="--log-file=stdout --realm=$${TURN_REALM:-turn.umetvchat.local} --fingerprint --lt-cred-mech --user=$${TURN_USERNAME:?Set TURN_USERNAME}:$${TURN_PASSWORD:?Set TURN_PASSWORD} --min-port=49152 --max-port=49252 --no-cli --no-tlsv1 --no-tlsv1_1 --external-ip=$${TURN_EXTERNAL_IP:?Set TURN_EXTERNAL_IP} --listening-port=3478 --tls-listening-port=5349"
        if [ -f /etc/coturn/certs/fullchain.pem ] && [ -f /etc/coturn/certs/privkey.pem ]; then
          args="$${args} --cert=/etc/coturn/certs/fullchain.pem --pkey=/etc/coturn/certs/privkey.pem"
        else
          args="$${args} --no-tls"
        fi
        exec turnserver -n $${args}
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "49152-49252:49152-49252/udp"
    volumes:
      - ./infra/coturn-certs:/etc/coturn/certs:ro

volumes:
  umetv-redis:
